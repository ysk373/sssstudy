<svg width="750" height="400" xmlns="http://www.w3.org/2000/svg">
      {/* 周波数ビン f=3 のデータ */}
      <rect x="50" y="50" width="320" height="50" fill="rgba(255, 200, 0, 0.3)" stroke="orange" strokeWidth="2" />
      <text x="210" y="40" textAnchor="middle" fontWeight="bold" fill="#1F2937">周波数ビン f=3 のデータ</text>
      <text x="210" y="115" textAnchor="middle" fontSize="12" fill="#1F2937">（時間×チャネル数の行列）</text>
      
      {/* 各時間フレームの複素数データ */}
      <text x="40" y="70" textAnchor="end" fontSize="10" fill="#1F2937">マイク1</text>
      <text x="40" y="90" textAnchor="end" fontSize="10" fill="#1F2937">マイク2</text>
      
      {/* 下付き添字を使った表現 */}
      <rect x="70" y="60" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="88" y="74" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(1,1)
      </text>
      
      <rect x="110" y="60" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="128" y="74" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(2,1)
      </text>
      
      <rect x="150" y="60" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="168" y="74" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(3,1)
      </text>
      
      <rect x="190" y="60" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="208" y="74" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(4,1)
      </text>
      
      <rect x="230" y="60" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="248" y="74" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(5,1)
      </text>
      
      <rect x="270" y="60" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="288" y="74" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(6,1)
      </text>
      
      <rect x="310" y="60" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="328" y="74" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(7,1)
      </text>
      
      <rect x="70" y="80" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="88" y="94" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(1,2)
      </text>
      
      <rect x="110" y="80" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="128" y="94" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(2,2)
      </text>
      
      <rect x="150" y="80" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="168" y="94" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(3,2)
      </text>
      
      <rect x="190" y="80" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="208" y="94" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(4,2)
      </text>
      
      <rect x="230" y="80" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="248" y="94" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(5,2)
      </text>
      
      <rect x="270" y="80" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="288" y="94" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(6,2)
      </text>
      
      <rect x="310" y="80" width="36" height="20" fill="rgba(255, 255, 255, 0.1)" stroke="gray" strokeWidth="1" />
      <text x="328" y="94" textAnchor="middle" fontSize="9" fill="#1F2937">
        X<tspan fontSize="7" dy="2">3</tspan>(7,2)
      </text>
      
      {/* ICAへの矢印 */}
      <line x1="210" y1="130" x2="210" y2="160" stroke="#1F2937" strokeWidth="2" />
      <polygon points="210,160 205,150 215,150" fill="#1F2937" />
      <text x="225" y="145" textAnchor="start" fontSize="12" fill="#1F2937">ICA適用</text>
      <text x="225" y="160" textAnchor="start" fontSize="10" fill="#1F2937">（f=3のみで独立に処理）</text>
      
      {/* ICAの数式表現 */}
      <rect x="110" y="180" width="200" height="80" fill="rgba(50, 50, 50, 0.2)" stroke="#007AFF" strokeWidth="1" rx="5" />
      <text x="210" y="200" textAnchor="middle" fontSize="16" fill="#1F2937">
        X<tspan fontSize="12" dy="2">3</tspan> = A<tspan fontSize="12" dy="2">3</tspan> S<tspan fontSize="12" dy="2">3</tspan>
      </text>
      <text x="210" y="230" textAnchor="middle" fontSize="16" fill="#1F2937">
        S<tspan fontSize="12" dy="2">3</tspan> = A<tspan fontSize="12" dy="2">3</tspan><tspan dy="-3">-1</tspan> X<tspan fontSize="12" dy="2">3</tspan>
      </text>
      <text x="210" y="250" textAnchor="middle" fontSize="12" fill="#1F2937">（f=3での混合・分離モデル）</text>
      
      {/* 各周波数での分離行列と結果 */}
      <text x="380" y="60" textAnchor="start" fontWeight="bold" fill="#1F2937">各周波数ビンごとの分離行列:</text>
      <text x="400" y="80" textAnchor="start" fill="#1F2937">・f=1: A<tspan fontSize="10" dy="2">1</tspan><tspan dy="-2">-1</tspan></text>
      <text x="400" y="100" textAnchor="start" fill="#1F2937">・f=2: A<tspan fontSize="10" dy="2">2</tspan><tspan dy="-2">-1</tspan></text>
      <text x="400" y="120" textAnchor="start" fill="#007AFF">・f=3: A<tspan fontSize="10" dy="2">3</tspan><tspan dy="-2">-1</tspan> ← 現在処理中</text>
      <text x="400" y="140" textAnchor="start" fill="#1F2937">・f=4: A<tspan fontSize="10" dy="2">4</tspan><tspan dy="-2">-1</tspan></text>
      <text x="400" y="160" textAnchor="start" fill="#1F2937">・f=5: A<tspan fontSize="10" dy="2">5</tspan><tspan dy="-2">-1</tspan></text>
      
      {/* データ形式の説明 */}
      <rect x="50" y="280" width="650" height="90" fill="rgba(50, 50, 50, 0.2)" stroke="#007AFF" strokeWidth="1" />
      <text x="60" y="300" textAnchor="start" fontWeight="bold" fill="#1F2937">データ形式と処理手順:</text>
      <text x="60" y="320" textAnchor="start" fontSize="12" fill="#1F2937">1. 時間-周波数領域のデータは通常 [周波数ビン数 × 時間フレーム数 × チャネル数] の3次元配列</text>
      <text x="60" y="340" textAnchor="start" fontSize="12" fill="#1F2937">2. 各周波数ビンfでのデータX<tspan fontSize="10" dy="2">f</tspan>は [時間フレーム数 × チャネル数] の2次元行列</text>
      <text x="60" y="360" textAnchor="start" fontSize="12" fill="#1F2937">3. 各周波数ビンの2次元行列に対して、独立にICAアルゴリズムを適用し、分離行列A<tspan fontSize="10" dy="2">f</tspan><tspan dy="-2">-1</tspan>を求める</text>
    </svg>
