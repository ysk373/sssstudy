<svg width="750" height="330" xmlns="http://www.w3.org/2000/svg">
      {/* 時間領域のデータ */}
      <rect x="50" y="50" width="220" height="100" fill="none" stroke="#007AFF" strokeWidth="1" />
      <text x="160" y="40" textAnchor="middle" fontWeight="bold" fill="#1F2937">時間領域の混合信号</text>
      
      {/* マイク1の信号 */}
      <text x="40" y="80" textAnchor="end" fontSize="12" fill="#1F2937">マイク1</text>
      <path d="M60,80 Q80,60 100,80 Q120,100 140,80 Q160,60 180,80 Q200,100 240,80" 
        stroke="#007AFF" strokeWidth="2" fill="none" />
        
      {/* マイク2の信号 */}
      <text x="40" y="120" textAnchor="end" fontSize="12" fill="#1F2937">マイク2</text>
      <path d="M60,120 Q80,100 100,120 Q120,100 140,120 Q160,100 180,120 Q200,100 240,120" 
        stroke="#007AFF" strokeWidth="2" fill="none" />
      
      {/* 変換矢印 */}
      <line x1="290" y1="80" x2="350" y2="80" stroke="#1F2937" strokeWidth="2" />
      <polygon points="350,80 340,75 340,85" fill="#1F2937" />
      <text x="320" y="70" textAnchor="middle" fontSize="12" fill="#1F2937">STFT</text>
      
      {/* 時間-周波数領域のデータ */}
      <rect x="380" y="30" width="260" height="240" fill="none" stroke="#007AFF" strokeWidth="1" />
      <text x="510" y="20" textAnchor="middle" fontWeight="bold" fill="#1F2937">時間-周波数領域のデータ</text>
      
      {/* 周波数ビンの例示 */}
      <rect x="380" y="50" width="260" height="30" fill="rgba(0, 0, 0, 0.05)" />
      <text x="365" y="65" textAnchor="end" fontSize="12" fill="#1F2937">f=1</text>
      <rect x="380" y="90" width="260" height="30" fill="rgba(0, 0, 0, 0.05)" />
      <text x="365" y="105" textAnchor="end" fontSize="12" fill="#1F2937">f=2</text>
      <rect x="380" y="130" width="260" height="30" fill="rgba(0, 0, 0, 0.1)" />
      <text x="365" y="145" textAnchor="end" fontSize="12" fill="#1F2937">f=3</text>
      <rect x="380" y="170" width="260" height="30" fill="rgba(0, 0, 0, 0.05)" />
      <text x="365" y="185" textAnchor="end" fontSize="12" fill="#1F2937">f=4</text>
      <rect x="380" y="210" width="260" height="30" fill="rgba(0, 0, 0, 0.05)" />
      <text x="365" y="225" textAnchor="end" fontSize="12" fill="#1F2937">f=5</text>
      
      {/* 時間フレームの区切り */}
      <line x1="420" y1="30" x2="420" y2="270" stroke="#1F2937" strokeWidth="0.5" strokeDasharray="2,2" />
      <line x1="460" y1="30" x2="460" y2="270" stroke="#1F2937" strokeWidth="0.5" strokeDasharray="2,2" />
      <line x1="500" y1="30" x2="500" y2="270" stroke="#1F2937" strokeWidth="0.5" strokeDasharray="2,2" />
      <line x1="540" y1="30" x2="540" y2="270" stroke="#1F2937" strokeWidth="0.5" strokeDasharray="2,2" />
      <line x1="580" y1="30" x2="580" y2="270" stroke="#1F2937" strokeWidth="0.5" strokeDasharray="2,2" />
      <line x1="620" y1="30" x2="620" y2="270" stroke="#1F2937" strokeWidth="0.5" strokeDasharray="2,2" />
      
      {/* 周波数ビン f=3 を強調 */}
      <rect x="380" y="130" width="260" height="30" fill="rgba(255, 200, 0, 0.3)" stroke="orange" strokeWidth="2" />
      
      {/* 軸ラベル */}
      <text x="510" y="295" textAnchor="middle" fontWeight="bold" fill="#1F2937">時間フレーム</text>
      <text x="330" y="150" textAnchor="middle" transform="rotate(-90, 330, 150)" fontWeight="bold" fill="#1F2937">周波数ビン</text>
    </svg>
